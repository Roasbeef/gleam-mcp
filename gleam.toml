name = "gleam_mcp"
version = "0.2.0"
description = "A typed MCP tools client and server over stdio and HTTP."
repository = { type = "github", user = "Roasbeef", repo = "gleam-mcp" }
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
weft = "== 0.4.5"
gleam_regexp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
glisten = ">= 9.0.0 and < 10.0.0"
gun = ">= 2.6.0 and < 3.0.0"
mist = { git = "https://github.com/Roasbeef/mist.git", ref = "1a81d90d58deac4f95e4a996e57279bc32dfd1a0" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
